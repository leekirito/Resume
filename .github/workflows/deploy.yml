name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]          # auto-deploy on every push to main
  workflow_dispatch:           # also allow manual trigger from GitHub UI

# Required permissions for the Pages deployment API
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Build ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: portfolio-app

      - name: Build Vite app
        run: npm run build
        working-directory: portfolio-app

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-app/dist   # the output of `npm run build`

  # ── 2. Deploy ───────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
